<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Soft Flat Background Container -->
  <rect x="6" y="6" width="52" height="52" rx="12" fill="#E3F2FD" stroke="#BBDEFB" stroke-width="2" />

  <!-- Receipt / Credit Card Elements -->
  <g>
    <!-- Receipt Base -->
    <rect x="18" y="14" width="28" height="36" rx="3" fill="#FFFFFF" />
    
    <!-- Header bar -->
    <rect x="18" y="14" width="28" height="8" rx="3" fill="#42A5F5" />
    
    <!-- Line items on receipt -->
    <line x1="23" y1="28" x2="33" y2="28" stroke="#90CAF9" stroke-width="2" stroke-linecap="round" />
    <line x1="23" y1="34" x2="41" y2="34" stroke="#90CAF9" stroke-width="2" stroke-linecap="round" />
    <line x1="23" y1="40" x2="37" y2="40" stroke="#42A5F5" stroke-width="2" stroke-linecap="round" />
  </g>
</svg>